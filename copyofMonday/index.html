<!DOCTYPE html>
<html lang="en" data-theme="sunset">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum Calculator | A + B Addition (Animated & Dynamic Themes)</title>
    <meta name="description" content="Vibrant animated addition calculator with real-time themes, particle effects, and interactive animations.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">

    <style>
        /* ==========================================================================
           Direct Inlined CSS to bypass any browser cache immediately!
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* --- THEME 1: SUNSET EMBER (Default - Bold Red/Orange/Gold Gradient) --- */
        :root, [data-theme="sunset"] {
            --bg-color: #0d0614;
            --bg-card: rgba(26, 12, 38, 0.82);
            --bg-elevated: rgba(40, 18, 58, 0.88);
            --gradient-accent: linear-gradient(135deg, #ff0844 0%, #ff4e50 35%, #f9d423 100%);
            --gradient-border: linear-gradient(90deg, #ff0844, #f9d423, #ff4e50, #ff0844);
            --primary-color: #ff3366;
            --primary-glow: rgba(255, 51, 102, 0.55);
            --accent-gold: #ffbe0b;
            --accent-cyan: #00f5d4;
            --accent-success: #10b981;
            --text-main: #fff5f5;
            --text-sub: #e2b4bd;
            --text-dim: #9c7178;
            --input-bg: rgba(18, 8, 28, 0.85);
            --input-border: rgba(255, 51, 102, 0.35);
            --input-focus: #ff3366;
            --orb-1: radial-gradient(circle, #ff0844 0%, rgba(255, 8, 68, 0) 70%);
            --orb-2: radial-gradient(circle, #f9d423 0%, rgba(249, 212, 35, 0) 70%);
            --orb-3: radial-gradient(circle, #9d4edd 0%, rgba(157, 78, 221, 0) 70%);
        }

        /* --- THEME 2: CYBER MATRIX EMERALD (Vibrant Green & Mint) --- */
        [data-theme="emerald"] {
            --bg-color: #03140e;
            --bg-card: rgba(6, 32, 22, 0.82);
            --bg-elevated: rgba(10, 48, 34, 0.88);
            --gradient-accent: linear-gradient(135deg, #00f5d4 0%, #10b981 50%, #70e000 100%);
            --gradient-border: linear-gradient(90deg, #00f5d4, #70e000, #10b981, #00f5d4);
            --primary-color: #00f5d4;
            --primary-glow: rgba(0, 245, 212, 0.55);
            --accent-gold: #70e000;
            --accent-cyan: #00b4d8;
            --accent-success: #00f5d4;
            --text-main: #f0fdf4;
            --text-sub: #86efac;
            --text-dim: #4ade80;
            --input-bg: rgba(4, 22, 16, 0.85);
            --input-border: rgba(0, 245, 212, 0.35);
            --input-focus: #00f5d4;
            --orb-1: radial-gradient(circle, #10b981 0%, rgba(16, 185, 129, 0) 70%);
            --orb-2: radial-gradient(circle, #00f5d4 0%, rgba(0, 245, 212, 0) 70%);
            --orb-3: radial-gradient(circle, #70e000 0%, rgba(112, 224, 0, 0) 70%);
        }

        /* --- THEME 3: NEON AURORA (Hot Pink, Purple & Cyan) --- */
        [data-theme="aurora"] {
            --bg-color: #090616;
            --bg-card: rgba(22, 14, 46, 0.82);
            --bg-elevated: rgba(34, 20, 70, 0.88);
            --gradient-accent: linear-gradient(135deg, #f72585 0%, #7209b7 50%, #4cc9f0 100%);
            --gradient-border: linear-gradient(90deg, #f72585, #4cc9f0, #7209b7, #f72585);
            --primary-color: #f72585;
            --primary-glow: rgba(247, 37, 133, 0.55);
            --accent-gold: #fee440;
            --accent-cyan: #4cc9f0;
            --accent-success: #06d6a0;
            --text-main: #ffffff;
            --text-sub: #d8b4e2;
            --text-dim: #9b72aa;
            --input-bg: rgba(14, 8, 32, 0.85);
            --input-border: rgba(247, 37, 133, 0.35);
            --input-focus: #f72585;
            --orb-1: radial-gradient(circle, #f72585 0%, rgba(247, 37, 133, 0) 70%);
            --orb-2: radial-gradient(circle, #7209b7 0%, rgba(114, 9, 183, 0) 70%);
            --orb-3: radial-gradient(circle, #4cc9f0 0%, rgba(76, 201, 240, 0) 70%);
        }

        /* --- THEME 4: ELECTRIC OCEAN (Deep Cobalt & Sky Blue) --- */
        [data-theme="ocean"] {
            --bg-color: #030b1e;
            --bg-card: rgba(8, 24, 56, 0.82);
            --bg-elevated: rgba(14, 38, 86, 0.88);
            --gradient-accent: linear-gradient(135deg, #0077b6 0%, #00b4d8 50%, #90e0ef 100%);
            --gradient-border: linear-gradient(90deg, #0077b6, #90e0ef, #00b4d8, #0077b6);
            --primary-color: #00b4d8;
            --primary-glow: rgba(0, 180, 216, 0.55);
            --accent-gold: #ffd166;
            --accent-cyan: #90e0ef;
            --accent-success: #06d6a0;
            --text-main: #f0f9ff;
            --text-sub: #bae6fd;
            --text-dim: #60a5fa;
            --input-bg: rgba(4, 16, 42, 0.85);
            --input-border: rgba(0, 180, 216, 0.35);
            --input-focus: #00b4d8;
            --orb-1: radial-gradient(circle, #0077b6 0%, rgba(0, 119, 182, 0) 70%);
            --orb-2: radial-gradient(circle, #00b4d8 0%, rgba(0, 180, 216, 0) 70%);
            --orb-3: radial-gradient(circle, #48cae4 0%, rgba(72, 202, 228, 0) 70%);
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem 1rem;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* Ambient Glow Spheres */
        .background-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.6;
            animation: orbFloat 16s ease-in-out infinite alternate;
            transition: background 0.8s ease;
        }

        .orb-1 { width: 550px; height: 550px; background: var(--orb-1); top: -140px; left: -140px; }
        .orb-2 { width: 600px; height: 600px; background: var(--orb-2); bottom: -180px; right: -140px; animation-delay: -5s; }
        .orb-3 { width: 420px; height: 420px; background: var(--orb-3); top: 30%; left: 60%; animation-delay: -10s; }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(70px, 50px) scale(1.15) rotate(90deg); }
            100% { transform: translate(-50px, 80px) scale(0.92) rotate(180deg); }
        }

        .calculator-container {
            width: 100%;
            max-width: 620px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 1.6rem;
            animation: containerEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes containerEntrance {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Theme Selector Bar */
        .theme-selector-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            background: rgba(18, 10, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            padding: 0.4rem 0.7rem;
            margin: 0 auto;
            width: fit-content;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .theme-btn {
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.45rem 1rem;
            border-radius: 999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .theme-color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px currentColor;
        }

        .dot-sunset { background: linear-gradient(135deg, #ff0844, #f9d423); color: #ff0844; }
        .dot-emerald { background: linear-gradient(135deg, #00f5d4, #70e000); color: #00f5d4; }
        .dot-aurora { background: linear-gradient(135deg, #f72585, #4cc9f0); color: #f72585; }
        .dot-ocean { background: linear-gradient(135deg, #0077b6, #90e0ef); color: #00b4d8; }

        .theme-btn:hover {
            color: #fff;
            transform: translateY(-2px);
        }

        .theme-btn.active {
            background: var(--gradient-accent);
            color: #ffffff;
            box-shadow: 0 4px 18px var(--primary-glow);
            transform: scale(1.04);
        }

        /* Header */
        .calculator-header {
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 1.25rem;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.16);
            color: var(--text-main);
            border-radius: 999px;
            margin-bottom: 0.9rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            animation: pulseBadge 3s infinite ease-in-out;
        }

        @keyframes pulseBadge {
            0%, 100% { border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 0 10px transparent; }
            50% { border-color: var(--primary-color); box-shadow: 0 0 20px var(--primary-glow); }
        }

        .title {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            background: var(--gradient-accent);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            animation: textShine 5s linear infinite alternate;
        }

        @keyframes textShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 1.05rem;
        }

        .subtitle .highlight {
            color: #ffffff;
            font-weight: 800;
        }

        .subtitle .formula {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-gold);
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-weight: 700;
        }

        /* Animated Glowing Border Card */
        .card-wrapper-animated {
            position: relative;
            border-radius: 28px;
            padding: 3px;
            background: var(--gradient-border);
            background-size: 300% 300%;
            animation: flowRainbowBorder 6s ease infinite;
            box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.7), 0 0 35px var(--primary-glow);
        }

        @keyframes flowRainbowBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 25px;
            padding: 2.3rem;
            position: relative;
            overflow: hidden;
        }

        /* Inputs Grid */
        .inputs-grid {
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .input-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-label {
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .var-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--gradient-accent);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 900;
            font-size: 0.92rem;
            color: #ffffff;
            box-shadow: 0 4px 12px var(--primary-glow);
            animation: bounceVar 3s ease-in-out infinite alternate;
        }

        .var-badge-b {
            animation-delay: -1.5s;
        }

        @keyframes bounceVar {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
        }

        .quick-actions {
            display: flex;
            gap: 0.4rem;
        }

        .btn-micro {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-sub);
            font-size: 0.8rem;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-micro:hover {
            background: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
            transform: scale(1.12);
        }

        /* Inputs */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 1.15rem 3rem 1.15rem 1.35rem;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 16px;
            color: #ffffff;
            font-size: 1.45rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-size: 1.05rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 400;
        }

        .input-wrapper input:focus {
            border-color: var(--input-focus);
            background: rgba(12, 6, 20, 0.95);
            box-shadow: 0 0 0 4px var(--primary-glow), 0 0 30px var(--primary-glow);
            transform: translateY(-2px);
        }

        .btn-clear-input {
            position: absolute;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.55rem;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .input-wrapper input:not(:placeholder-shown) + .btn-clear-input {
            opacity: 0.75;
            pointer-events: auto;
        }

        .btn-clear-input:hover {
            color: #ff0844;
            opacity: 1;
            transform: scale(1.25) rotate(90deg);
        }

        /* Divider */
        .operator-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.3rem;
            position: relative;
            margin: -0.2rem 0;
        }

        .operator-symbol {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--gradient-accent);
            color: #ffffff;
            font-size: 1.75rem;
            font-weight: 900;
            box-shadow: 0 6px 22px var(--primary-glow);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pulseOperatorGlow 3s infinite ease-in-out;
        }

        @keyframes pulseOperatorGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 18px var(--primary-glow); }
            50% { transform: scale(1.12); box-shadow: 0 8px 30px var(--primary-glow); }
        }

        .operator-symbol:hover {
            transform: scale(1.2) rotate(90deg);
        }

        .btn-swap {
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-swap:hover {
            background: var(--gradient-accent);
            color: #fff;
            transform: scale(1.18) rotate(180deg);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        /* Controls */
        .controls-row {
            display: flex;
            gap: 0.9rem;
            margin-top: 0.7rem;
        }

        .btn-primary {
            flex: 1.4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            padding: 1.15rem 1.6rem;
            background: var(--gradient-accent);
            background-size: 200% 200%;
            border: none;
            border-radius: 16px;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            cursor: pointer;
            box-shadow: 0 10px 30px var(--primary-glow);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: rotate(30deg) translateY(-100%);
            transition: transform 0.6s ease;
        }

        .btn-primary:hover::after {
            transform: rotate(30deg) translateY(100%);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 16px 40px var(--primary-glow);
            filter: brightness(1.12);
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-secondary, .btn-ghost {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1.15rem 1.3rem;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .btn-ghost {
            background: transparent;
            border: 1.5px solid rgba(255, 8, 68, 0.35);
            color: #ff3366;
        }

        .btn-ghost:hover {
            background: rgba(255, 8, 68, 0.18);
            border-color: #ff3366;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 8, 68, 0.3);
        }

        /* Result Section */
        .result-section {
            margin-top: 2rem;
        }

        .result-box {
            background: var(--bg-elevated);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 1.8rem;
            position: relative;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .result-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--gradient-accent);
            opacity: 0.7;
        }

        .result-box.has-result {
            border-color: var(--accent-success);
            box-shadow: 0 18px 45px -5px rgba(16, 185, 129, 0.35), 0 0 25px rgba(16, 185, 129, 0.25);
        }

        .result-box.has-result::before {
            background: var(--accent-success);
            opacity: 1;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.9rem;
        }

        .result-label {
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-sub);
        }

        .btn-copy {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: var(--text-sub);
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-copy:hover {
            background: var(--gradient-accent);
            border-color: transparent;
            color: #fff;
            transform: scale(1.06);
        }

        .result-value-row {
            margin-bottom: 0.9rem;
        }

        .result-value {
            font-size: 3.5rem;
            font-weight: 900;
            font-family: 'JetBrains Mono', monospace;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
            word-break: break-all;
            display: block;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-box.has-result .result-value {
            background: linear-gradient(135deg, #00f5d4 0%, #10b981 50%, #f9d423 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-value.pulse-animation {
            animation: bounceBlast 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceBlast {
            0% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        .formula-breakdown {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: var(--text-dim);
            padding-top: 0.75rem;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .formula-breakdown.highlighted {
            color: #ffffff;
        }

        /* Visualizer */
        .visualizer-container {
            margin-top: 1.4rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .visualizer-bar {
            height: 30px;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 999px;
            overflow: hidden;
            display: flex;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .bar-segment {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .bar-a { background: linear-gradient(90deg, #ff0844, #ff4e50); }
        .bar-b { background: linear-gradient(90deg, #f9d423, #ffbe0b); }

        .bar-text {
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
            padding: 0 0.5rem;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        }

        .visualizer-legend {
            display: flex;
            justify-content: space-between;
            margin-top: 0.6rem;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-a { background: #ff0844; box-shadow: 0 0 10px #ff0844; }
        .dot-b { background: #f9d423; box-shadow: 0 0 10px #f9d423; }

        /* History Card */
        .history-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            padding: 1.7rem;
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.6);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .history-header h2 {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 0.4rem;
        }

        .history-list::-webkit-scrollbar {
            width: 6px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.15rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-color);
            transform: translateX(6px);
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .history-expr {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.98rem;
            color: #ffffff;
        }

        .history-result {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--accent-success);
        }

        .history-empty {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.95rem;
            padding: 1.7rem 0;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: var(--gradient-accent);
            color: #ffffff;
            padding: 0.8rem 1.8rem;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 800;
            box-shadow: 0 12px 35px var(--primary-glow);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 540px) {
            body { padding: 1.5rem 0.8rem; }
            .card { padding: 1.5rem; }
            .title { font-size: 2rem; }
            .theme-selector-bar { flex-wrap: wrap; }
            .controls-row { flex-wrap: wrap; }
            .btn-primary { width: 100%; order: 1; }
            .btn-secondary { flex: 1; order: 2; }
            .btn-ghost { flex: 1; order: 3; }
            .result-value { font-size: 2.6rem; }
        }
    </style>
</head>
<body>
    <!-- Interactive Background Particle Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Animated Ambient Lighting Orbs -->
    <div class="background-glow">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <main class="calculator-container">
        <!-- Interactive Theme Selector Bar -->
        <nav class="theme-selector-bar" aria-label="Color Theme Selection">
            <button type="button" class="theme-btn active" data-set-theme="sunset">
                <span class="theme-color-dot dot-sunset"></span> Sunset Ember
            </button>
            <button type="button" class="theme-btn" data-set-theme="emerald">
                <span class="theme-color-dot dot-emerald"></span> Cyber Emerald
            </button>
            <button type="button" class="theme-btn" data-set-theme="aurora">
                <span class="theme-color-dot dot-aurora"></span> Neon Aurora
            </button>
            <button type="button" class="theme-btn" data-set-theme="ocean">
                <span class="theme-color-dot dot-ocean"></span> Electric Ocean
            </button>
        </nav>

        <header class="calculator-header">
            <div class="badge">✨ Dynamic Arithmetic Engine</div>
            <h1 class="title">Addition of Two Numbers</h1>
            <p class="subtitle">Compute sum of <span class="highlight">a</span> and <span class="highlight">b</span> &mdash; <span class="formula">a + b</span></p>
        </header>

        <!-- Animated Rainbow / Gradient Border Container -->
        <div class="card-wrapper-animated">
            <section class="card calculator-card">
                <form id="additionForm" class="inputs-grid" onsubmit="event.preventDefault();">
                    <!-- Input A -->
                    <div class="input-group" id="groupA">
                        <div class="input-label-row">
                            <label for="numA" class="input-label">
                                <span class="var-badge">a</span> First Number
                            </label>
                            <span class="quick-actions">
                                <button type="button" class="btn-micro" onclick="adjustValue('numA', 1)" title="Add 1">+1</button>
                                <button type="button" class="btn-micro" onclick="adjustValue('numA', -1)" title="Subtract 1">-1</button>
                            </span>
                        </div>
                        <div class="input-wrapper">
                            <input 
                                type="number" 
                                id="numA" 
                                name="numA" 
                                placeholder="Enter number a (e.g. 15)" 
                                step="any"
                                required
                                autocomplete="off"
                            >
                            <button type="button" class="btn-clear-input" onclick="clearSingleInput('numA')" aria-label="Clear a">&times;</button>
                        </div>
                    </div>

                    <!-- Operator Badge & Swap Button -->
                    <div class="operator-divider">
                        <span class="operator-symbol" id="operatorBtn" title="Click to calculate">+</span >
                        <button type="button" class="btn-swap" id="btnSwap" title="Swap values of A and B" aria-label="Swap A and B">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M7 16V4m0 0L3 8m4-4l4 4m6 4v12m0 0l4-4m-4 4l-4-4"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Input B -->
                    <div class="input-group" id="groupB">
                        <div class="input-label-row">
                            <label for="numB" class="input-label">
                                <span class="var-badge var-badge-b">b</span> Second Number
                            </label>
                            <span class="quick-actions">
                                <button type="button" class="btn-micro" onclick="adjustValue('numB', 1)" title="Add 1">+1</button>
                                <button type="button" class="btn-micro" onclick="adjustValue('numB', -1)" title="Subtract 1">-1</button>
                            </span>
                        </div>
                        <div class="input-wrapper">
                            <input 
                                type="number" 
                                id="numB" 
                                name="numB" 
                                placeholder="Enter number b (e.g. 25)" 
                                step="any"
                                required
                                autocomplete="off"
                            >
                            <button type="button" class="btn-clear-input" onclick="clearSingleInput('numB')" aria-label="Clear b">&times;</button>
                        </div>
                    </div>

                    <!-- Action Controls -->
                    <div class="controls-row">
                        <button type="button" class="btn-primary" id="btnCalculate">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            <span>Calculate Sum (a + b)</span>
                        </button>
                        <button type="button" class="btn-secondary" id="btnRandom" title="Generate Random Numbers">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                                <circle cx="8" cy="8" r="1.5" fill="currentColor"></circle>
                                <circle cx="16" cy="16" r="1.5" fill="currentColor"></circle>
                                <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
                            </svg>
                            <span>Random</span>
                        </button>
                        <button type="button" class="btn-ghost" id="btnClear" title="Clear all inputs">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                            </svg>
                            <span>Clear</span>
                        </button>
                    </div>
                </form>

                <!-- Result Box -->
                <div class="result-section" id="resultSection">
                    <div class="result-box" id="resultBox">
                        <div class="result-header">
                            <span class="result-label">Result: Sum (a + b)</span>
                            <button type="button" class="btn-copy" id="btnCopy" title="Copy result to clipboard">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                                <span id="copyText">Copy</span>
                            </button>
                        </div>
                        <div class="result-value-row">
                            <span class="result-value" id="resultValue">--</span>
                        </div>
                        <div class="formula-breakdown" id="formulaBreakdown">
                            <span id="formulaText">Enter values above and click Calculate</span>
                        </div>
                        
                        <!-- Proportion Visualizer -->
                        <div class="visualizer-container" id="visualizer" style="display: none;">
                            <div class="visualizer-bar">
                                <div class="bar-segment bar-a" id="barA" style="width: 50%;">
                                    <span class="bar-text" id="barAText">a</span>
                                </div>
                                <div class="bar-segment bar-b" id="barB" style="width: 50%;">
                                    <span class="bar-text" id="barBText">b</span>
                                </div>
                            </div>
                            <div class="visualizer-legend">
                                <span class="legend-item"><span class="legend-dot dot-a"></span> A Contribution</span>
                                <span class="legend-item"><span class="legend-dot dot-b"></span> B Contribution</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Toast notification -->
                <div class="toast" id="toast">Copied to clipboard!</div>
            </section>
        </div>

        <!-- Calculation History -->
        <section class="history-card" id="historyCard">
            <div class="history-header">
                <h2>Calculation History</h2>
                <button type="button" class="btn-micro" id="btnClearHistory">Clear All</button>
            </div>
            <ul class="history-list" id="historyList">
                <li class="history-empty">No calculations yet. Enter numbers above!</li>
            </ul>
        </section>
    </main>

    <script src="script.js?v=3"></script>
    <script>
        // Inline self-contained execution logic to guarantee instant response
        document.addEventListener('DOMContentLoaded', () => {
            const numAInput = document.getElementById('numA');
            const numBInput = document.getElementById('numB');
            const btnCalculate = document.getElementById('btnCalculate');
            const btnRandom = document.getElementById('btnRandom');
            const btnClear = document.getElementById('btnClear');
            const btnSwap = document.getElementById('btnSwap');
            const btnCopy = document.getElementById('btnCopy');
            const btnClearHistory = document.getElementById('btnClearHistory');
            const operatorBtn = document.getElementById('operatorBtn');
            const resultBox = document.getElementById('resultBox');
            const resultValue = document.getElementById('resultValue');
            const formulaText = document.getElementById('formulaText');
            const formulaBreakdown = document.getElementById('formulaBreakdown');
            const visualizer = document.getElementById('visualizer');
            const barA = document.getElementById('barA');
            const barB = document.getElementById('barB');
            const barAText = document.getElementById('barAText');
            const barBText = document.getElementById('barBText');
            const historyList = document.getElementById('historyList');
            const toast = document.getElementById('toast');
            const themeButtons = document.querySelectorAll('.theme-btn');

            let history = [];
            let currentAnimFrame = null;

            // 1. Theme Switcher
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('sumCalcTheme', theme);
                themeButtons.forEach(btn => {
                    if (btn.getAttribute('data-set-theme') === theme) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }

            themeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    applyTheme(btn.getAttribute('data-set-theme'));
                });
            });

            const savedTheme = localStorage.getItem('sumCalcTheme') || 'sunset';
            applyTheme(savedTheme);

            // 2. Background Particle Canvas
            const canvas = document.getElementById('particleCanvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;

                window.addEventListener('resize', () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                });

                const symbols = ['+', '=', '•', '✦', '▲', '●'];
                const particles = [];
                const count = Math.min(35, Math.floor(window.innerWidth / 35));

                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        size: Math.random() * 14 + 10,
                        symbol: symbols[Math.floor(Math.random() * symbols.length)],
                        opacity: Math.random() * 0.35 + 0.1,
                        rot: Math.random() * Math.PI * 2,
                        vrot: (Math.random() - 0.5) * 0.02
                    });
                }

                function draw() {
                    ctx.clearRect(0, 0, width, height);
                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.rot += p.vrot;
                        if (p.x < -20) p.x = width + 20;
                        if (p.x > width + 20) p.x = -20;
                        if (p.y < -20) p.y = height + 20;
                        if (p.y > height + 20) p.y = -20;

                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rot);
                        ctx.font = `${p.size}px 'JetBrains Mono', monospace`;
                        ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(p.symbol, 0, 0);
                        ctx.restore();
                    });
                    requestAnimationFrame(draw);
                }
                draw();
            }

            // 3. Sparkle Confetti Burst
            function createBurst(originEl) {
                const rect = originEl.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const colors = ['#ff0844', '#f9d423', '#00f5d4', '#f72585', '#70e000', '#ffbe0b'];

                for (let i = 0; i < 28; i++) {
                    const sp = document.createElement('div');
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const size = Math.floor(Math.random() * 8 + 6);
                    sp.style.position = 'fixed';
                    sp.style.left = `${cx}px`;
                    sp.style.top = `${cy}px`;
                    sp.style.width = `${size}px`;
                    sp.style.height = `${size}px`;
                    sp.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
                    sp.style.backgroundColor = color;
                    sp.style.boxShadow = `0 0 12px ${color}`;
                    sp.style.pointerEvents = 'none';
                    sp.style.zIndex = '9999';
                    sp.style.transition = 'all 0.65s cubic-bezier(0.16, 1, 0.3, 1)';
                    document.body.appendChild(sp);

                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.random() * 120 + 40;
                    const dx = Math.cos(angle) * dist;
                    const dy = Math.sin(angle) * dist;

                    requestAnimationFrame(() => {
                        sp.style.transform = `translate(${dx}px, ${dy}px) scale(0)`;
                        sp.style.opacity = '0';
                    });
                    setTimeout(() => sp.remove(), 700);
                }
            }

            function formatNum(num) {
                if (!Number.isFinite(num)) return String(num);
                const fixed = parseFloat(num.toFixed(8));
                return fixed.toLocaleString('en-US', { maximumFractionDigits: 8 });
            }

            function animateNumber(target) {
                if (currentAnimFrame) cancelAnimationFrame(currentAnimFrame);
                if (!Number.isFinite(target) || Math.abs(target) > 10000000) {
                    resultValue.textContent = formatNum(target);
                    return;
                }
                const duration = 400;
                const start = 0;
                const startTime = performance.now();

                function step(now) {
                    const elapsed = now - startTime;
                    const prog = Math.min(elapsed / duration, 1);
                    const ease = 1 - Math.pow(1 - prog, 3);
                    resultValue.textContent = formatNum(start + (target - start) * ease);
                    if (prog < 1) currentAnimFrame = requestAnimationFrame(step);
                    else resultValue.textContent = formatNum(target);
                }
                currentAnimFrame = requestAnimationFrame(step);
            }

            function calculate() {
                const valA = numAInput.value.trim();
                const valB = numBInput.value.trim();

                if (valA === '' || valB === '') {
                    formulaText.textContent = 'Please enter both numbers (a and b)';
                    formulaBreakdown.classList.remove('highlighted');
                    resultBox.classList.remove('has-result');
                    resultValue.textContent = '--';
                    visualizer.style.display = 'none';
                    if (valA === '') numAInput.focus();
                    else numBInput.focus();
                    return;
                }

                const a = parseFloat(valA);
                const b = parseFloat(valB);
                if (isNaN(a) || isNaN(b)) {
                    formulaText.textContent = 'Invalid numbers entered.';
                    resultValue.textContent = 'Error';
                    return;
                }

                const sum = a + b;
                const formattedA = formatNum(a);
                const formattedB = formatNum(b);
                const formattedSum = formatNum(sum);

                animateNumber(sum);
                resultValue.classList.remove('pulse-animation');
                void resultValue.offsetWidth;
                resultValue.classList.add('pulse-animation');

                resultBox.classList.add('has-result');
                formulaText.innerHTML = `<strong>${formattedA}</strong> + <strong>${formattedB}</strong> = <strong>${formattedSum}</strong>`;
                formulaBreakdown.classList.add('highlighted');

                createBurst(resultValue);

                if (a > 0 && b > 0 && sum > 0) {
                    visualizer.style.display = 'block';
                    const pctA = Math.max(10, Math.min(90, (a / sum) * 100));
                    const pctB = 100 - pctA;
                    barA.style.width = `${pctA.toFixed(1)}%`;
                    barB.style.width = `${pctB.toFixed(1)}%`;
                    barAText.textContent = `${pctA.toFixed(0)}% (a)`;
                    barBText.textContent = `${pctB.toFixed(0)}% (b)`;
                } else {
                    visualizer.style.display = 'none';
                }

                // History
                if (history.length === 0 || history[0].a !== formattedA || history[0].b !== formattedB) {
                    history.unshift({ a: formattedA, b: formattedB, sum: formattedSum });
                    if (history.length > 8) history.pop();
                    renderHistory();
                }
            }

            function renderHistory() {
                if (history.length === 0) {
                    historyList.innerHTML = '<li class="history-empty">No calculations yet. Enter numbers above!</li>';
                    return;
                }
                historyList.innerHTML = history.map((it, idx) => `
                    <li class="history-item" data-idx="${idx}" title="Click to load into inputs">
                        <span class="history-expr">${it.a} + ${it.b}</span>
                        <span class="history-result">= ${it.sum}</span>
                    </li>
                `).join('');

                historyList.querySelectorAll('.history-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const item = history[el.getAttribute('data-idx')];
                        if (item) {
                            numAInput.value = item.a.replace(/,/g, '');
                            numBInput.value = item.b.replace(/,/g, '');
                            calculate();
                        }
                    });
                });
            }

            btnSwap.addEventListener('click', () => {
                btnSwap.style.transform = 'scale(1.2) rotate(180deg)';
                setTimeout(() => { btnSwap.style.transform = ''; }, 300);
                const tmp = numAInput.value;
                numAInput.value = numBInput.value;
                numBInput.value = tmp;
                if (numAInput.value !== '' || numBInput.value !== '') calculate();
            });

            if (operatorBtn) {
                operatorBtn.addEventListener('click', () => {
                    operatorBtn.classList.remove('pulse-animation');
                    void operatorBtn.offsetWidth;
                    operatorBtn.classList.add('pulse-animation');
                    if (numAInput.value !== '' && numBInput.value !== '') calculate();
                });
            }

            btnRandom.addEventListener('click', () => {
                numAInput.value = Math.floor(Math.random() * 99) + 1;
                numBInput.value = Math.floor(Math.random() * 99) + 1;
                calculate();
            });

            btnClear.addEventListener('click', () => {
                numAInput.value = '';
                numBInput.value = '';
                resultValue.textContent = '--';
                resultBox.classList.remove('has-result');
                formulaText.textContent = 'Enter values above and click Calculate';
                formulaBreakdown.classList.remove('highlighted');
                visualizer.style.display = 'none';
                numAInput.focus();
            });

            btnCopy.addEventListener('click', () => {
                const text = resultValue.textContent.trim();
                if (text === '--' || text === 'Error') {
                    showToast('No result to copy yet!');
                    return;
                }
                navigator.clipboard.writeText(text).then(() => {
                    showToast('Result copied: ' + text);
                }).catch(() => {
                    showToast('Failed to copy');
                });
            });

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2200);
            }

            btnClearHistory.addEventListener('click', () => {
                history = [];
                renderHistory();
                showToast('History cleared');
            });

            numAInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') calculate(); });
            numBInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') calculate(); });
            btnCalculate.addEventListener('click', calculate);

            // Initial calculation
            numAInput.value = '18';
            numBInput.value = '24';
            calculate();
        });

        window.adjustValue = function(id, d) {
            const el = document.getElementById(id);
            if (!el) return;
            el.value = (parseFloat(el.value) || 0) + d;
            document.getElementById('btnCalculate').click();
        };

        window.clearSingleInput = function(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.value = '';
            el.focus();
        };
    </script>
</body>
</html>
